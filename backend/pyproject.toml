[tool.poetry]
name = "agrivision-backend"
version = "0.1.0"
description = "FastAPI backend for tomato disease detection"
authors = ["Abhilash-K-R"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
onnxruntime = "^1.17.0"
numpy = "^1.26.0"
pillow = "^10.2.0"
python-multipart = "^0.0.9"
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.1.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.57"}
asyncpg = "^0.32.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
httpx = "^0.26.0"
ruff = "^0.2.1"
mypy = "^1.8.0"
black = "^24.1.1"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
